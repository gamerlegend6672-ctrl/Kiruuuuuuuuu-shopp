
name: Extract KIRUU SHOP ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and extract ZIP
        run: |
          cat KIRUU-SHOP.part* > /tmp/KIRUU-SHOP.zip
          unzip -tq /tmp/KIRUU-SHOP.zip
          mkdir -p /tmp/kiruu-unpack
          unzip -q /tmp/KIRUU-SHOP.zip -d /tmp/kiruu-unpack
          test -d /tmp/kiruu-unpack/KIRUU-SHOP
          find /tmp/kiruu-unpack/KIRUU-SHOP -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          rm -f KIRUU-SHOP.part*

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract KIRUU SHOP project files"
          git push
