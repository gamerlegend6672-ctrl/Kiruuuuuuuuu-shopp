
name: Extract KIRUU SHOP ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild ZIP
        run: |
          cat KIRUU-SHOP.part* > /tmp/KIRUU-SHOP.zip
          unzip -tq /tmp/KIRUU-SHOP.zip

      - name: Extract project
        run: |
          mkdir -p /tmp/kiruu
          unzip -q /tmp/KIRUU-SHOP.zip -d /tmp/kiruu
          test -d /tmp/kiruu/KIRUU-SHOP
          rsync -av --exclude='.github' /tmp/kiruu/KIRUU-SHOP/ ./
          rm -f KIRUU-SHOP.part*

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add KIRUU SHOP project"
          git push
